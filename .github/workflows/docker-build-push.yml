name: Build, Push and Deploy

# Builds the Next.js app, pushes it to the private registry, then pins the
# rebuilt image in infra/k8s/kustomization.yaml to this build's immutable
# develop-<sha7> tag with a [skip ci] commit. Deployment itself is GitOps:
# ArgoCD on the Hetzner node watches infra/k8s on develop and syncs the cluster
# to whatever the manifests say — no SSH from CI, no kubeconfig on the runner,
# the kube-apiserver stays private.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   REGISTRY_HOST      registry.adiwave.com  (host[:port], no scheme)
#   REGISTRY_USERNAME  registry user
#   REGISTRY_PASSWORD  registry password
#
# registry.adiwave.com carries a valid Let's Encrypt certificate, so TLS
# verifies normally and nothing extra is needed.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'infra/argocd/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_HOST }}/me/invitation-funnel
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=invitation-funnel
          cache-to: type=gha,scope=invitation-funnel,mode=max

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### invitation-funnel" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  update-manifests:
    needs: build-and-push
    # Pins the just-built image to its immutable develop-<sha7> tag; ArgoCD picks
    # the commit up and syncs. Runs only after the build succeeded — never pin a
    # tag that was not pushed.
    if: needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: manifest-bump
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Pin rebuilt image to this build's tag
        run: |
          TAG="develop-${GITHUB_SHA::7}"
          sed -i "/newName: .*\/me\/invitation-funnel\$/{n;s|newTag: .*|newTag: ${TAG}|}" infra/k8s/kustomization.yaml
          if git diff --quiet; then
            echo "No image pin changed — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/kustomization.yaml
          git commit -m "chore: pin image to ${TAG} [skip ci]"
          # develop may have moved while we built; rebase-and-retry
          for i in 1 2 3; do
            git push origin HEAD:develop && exit 0
            git pull --rebase origin develop || true
          done
          echo "::error::Could not push the image pin after 3 attempts."
          exit 1
