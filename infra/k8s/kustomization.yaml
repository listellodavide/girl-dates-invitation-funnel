apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app.yaml
  - gateway.yaml

# CI rewrites newTag to the immutable develop-<sha7> tag of the image it just
# pushed, in a [skip ci] commit. ArgoCD then syncs the cluster to it.
# Do not edit newTag by hand — the next build overwrites it.
images:
  - name: registry.adiwave.com/me/invitation-funnel
    newName: registry.adiwave.com/me/invitation-funnel
    newTag: develop-fa59300
